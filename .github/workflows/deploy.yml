name: Deploy to Netcup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raya-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: true
      - name: Build immutable release
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/release"
          mkdir -p "$release_dir"
          go test -short -timeout 180s ./...
          mkdir -p "$release_dir/cmd/server"
          go build -trimpath -o "$release_dir/cmd/server/server" ./cmd/server
          printf '{"commit":"%s"}\n' "$GITHUB_SHA" > "$release_dir/release.json"
          tar --format=ustar --dereference --owner=0 --group=0 --numeric-owner -C "$release_dir" -czf "$RUNNER_TEMP/release.tar.gz" .

      - name: Publish through the project-only SSH entrypoint
        env:
          DEPLOY_KEY: ${{ secrets.NETCUP_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.NETCUP_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.NETCUP_HOST || '62.83.86.239' }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          umask 077
          key_file="$RUNNER_TEMP/project_deploy_key"
          hosts_file="$RUNNER_TEMP/project_known_hosts"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          printf '%s\n' "$KNOWN_HOSTS" > "$hosts_file"
          ssh -i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts_file" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "deploy-raya@$DEPLOY_HOST" "deploy $GITHUB_SHA" < "$RUNNER_TEMP/release.tar.gz"

      - name: Verify public production endpoints
        env:
          VERIFY_HOST: ${{ vars.NETCUP_HOST || '62.83.86.239' }}
        run: |
          set -euo pipefail
          function probe() {
            local target
            for target in "$@"; do
              if [[ "$target" == https://* ]]; then
                local domain="${target#https://}"
                domain="${domain%%/*}"
                curl --resolve "$domain:443:$VERIFY_HOST" "$@"
                return
              fi
            done
            return 1
          }
          status=$(probe -sS --connect-timeout 10 --max-time 20 -o /dev/null -w '%{http_code}' https://api.raya.ampleev.com/)
          test "$status" = 415
